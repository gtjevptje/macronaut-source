[pytest]
# ⚠ Without this file, a bare `pytest` from the repo root fails at COLLECTION
# with `module 'flow' has no attribute 'DETECT_KINDS'` — and the error names
# tests/ files, so it reads as a broken test suite rather than a config gap.
#
# The cause is that the root holds several full, stale copies of the project:
#   .claude/worktrees/…   an agent worktree pinned to an old commit
#   backups/phase2_…/     a June snapshot, test_flow.py included
# pytest recurses into them, imports *their* flow.py first, and every test in
# the real tests/ then runs against June's module. `pytest tests/…` by hand
# passes, which is what makes this so confusing to hit: the suite is only
# broken in the one form anybody types first.
testpaths = tests
norecursedirs = .git .claude backups build dist site scratchpad _shots *.egg *.worktrees
