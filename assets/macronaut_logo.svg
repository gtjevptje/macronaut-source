<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="helmet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.45" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="visor" cx="0.38" cy="0.30" r="0.95">
      <stop offset="0" stop-color="#2a3350"/>
      <stop offset="0.55" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- helmet dome -->
  <circle cx="128" cy="126" r="96" fill="url(#helmet)"/>
  <!-- top sheen -->
  <ellipse cx="100" cy="74" rx="42" ry="24" fill="#ffffff" opacity="0.22"/>
  <!-- visor housing -->
  <rect x="44" y="86" width="168" height="104" rx="50" fill="url(#rim)"/>
  <!-- visor glass -->
  <rect x="58" y="98" width="140" height="80" rx="40" fill="url(#visor)"/>
  <!-- visor glossy highlight -->
  <path d="M74 120 q34 -26 96 -14 q-44 -2 -96 36 z" fill="#8ea2ff" opacity="0.30"/>
  <!-- cursor reflected in visor -->
  <g transform="translate(120 116) rotate(8)">
    <path d="M0 0 L0 40 L11 30 L18 47 L26 43 L18 27 L33 27 Z"
          fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- sparkle -->
  <g fill="#e0e7ff">
    <path d="M196 70 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.9"/>
    <circle cx="74" cy="150" r="2.5" opacity="0.7"/>
  </g>
</svg>
